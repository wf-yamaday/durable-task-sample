name: "[orchestrator-worker] Build Image"

on:
  push:
    branches: [main]
    paths:
      - "orchestrator-worker/**"
      - ".github/workflows/build-orchestrator-worker.yaml"

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-durabletask-dev
  AZURE_CONTAINER_REGISTRY: crdurabletaskdev5iwykh
  AZURE_CONTAINER_APP: ca-orchestrator-durabletask-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to Azure Container Registry
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator-worker
          file: ./orchestrator-worker/.docker/Dockerfile
          push: true
          tags: |
            ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/durable-task-orchestrator-worker:latest
            ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/durable-task-orchestrator-worker:${{ github.sha }}
      - name: Roll out latest image
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/durable-task-orchestrator-worker:latest" \
            --revision-suffix "sha-${GITHUB_SHA::7}"
