name: "[worker] Build Image"

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/build-worker.yaml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/.docker/Dockerfile
          push: false
          tags: durable-task-worker:ci
