[project]
name = "durable-task-orchestrator-worker"
version = "0.1.0"
description = "Worker application for Durable Task orchestrations"
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.25.3",
    "durabletask-azuremanaged",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[project.scripts]
durable-task-orchestrator-worker = "main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "settings"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
